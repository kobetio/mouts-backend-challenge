@if (loadError()) {
  <div class="state-message error">{{ loadError() }}</div>
} @else if (isEditMode && !sale()) {
  <div class="state-message">Loading sale…</div>
} @else {
  <app-sale-form
    [sale]="sale()"
    [isEditMode]="isEditMode"
    [submitting]="submitting()"
    (formSubmit)="onSubmit($event)"
    (formCancel)="onCancel()"
  />
}
