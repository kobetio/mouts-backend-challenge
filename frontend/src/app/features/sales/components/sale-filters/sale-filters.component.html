<form class="filters" [formGroup]="filtersForm" (ngSubmit)="onApply()">
  <mat-form-field appearance="outline">
    <mat-label>Customer name</mat-label>
    <input matInput formControlName="customerName" placeholder="e.g. John*" />
  </mat-form-field>

  <mat-form-field appearance="outline">
    <mat-label>Branch name</mat-label>
    <input matInput formControlName="branchName" placeholder="e.g. Downtown*" />
  </mat-form-field>

  <mat-form-field appearance="outline">
    <mat-label>Status</mat-label>
    <mat-select formControlName="cancelled">
      <mat-option value="all">All</mat-option>
      <mat-option value="false">Active</mat-option>
      <mat-option value="true">Cancelled</mat-option>
    </mat-select>
  </mat-form-field>

  <mat-form-field appearance="outline">
    <mat-label>Min total</mat-label>
    <input matInput type="number" formControlName="minTotalAmount" min="0" step="0.01" />
  </mat-form-field>

  <mat-form-field appearance="outline">
    <mat-label>Max total</mat-label>
    <input matInput type="number" formControlName="maxTotalAmount" min="0" step="0.01" />
  </mat-form-field>

  <mat-form-field appearance="outline">
    <mat-label>From date</mat-label>
    <input matInput type="date" formControlName="minDate" />
  </mat-form-field>

  <mat-form-field appearance="outline">
    <mat-label>To date</mat-label>
    <input matInput type="date" formControlName="maxDate" />
  </mat-form-field>

  <div class="actions">
    <button mat-stroked-button type="button" (click)="onReset()">Reset</button>
    <button mat-flat-button color="primary" type="submit">Apply filters</button>
  </div>
</form>
