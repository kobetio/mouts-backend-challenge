server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Same-origin proxy to the backend API, so the containerized frontend
    # never has to deal with CORS. Local `ng serve` uses `proxy.conf.json`
    # for the equivalent behavior during development.
    location /api/ {
        proxy_pass http://ambev.developerevaluation.webapi:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Angular standalone routing: fall back to index.html for any
    # non-file route so client-side navigation/refresh works.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
